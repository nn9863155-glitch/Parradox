<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paradox Gx</title>
    
    <link rel="icon" href="https://fav.farm/💎">

    <style>
        :root {
            --bg-color: #000814;
            --neon-color: #00f2ff;
            --text-color: #ffffff;
            --neon-shadow: 0 0 20px var(--neon-color), 0 0 40px var(--neon-color);
        }

        .light-mode {
            --bg-color: #f0f0f0;
            --neon-color: #0066ff;
            --text-color: #111;
            --neon-shadow: 0 0 10px rgba(0, 102, 255, 0.5);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            transition: 0.5s ease;
            overflow: hidden;
        }

        h1 {
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 12px;
            text-shadow: var(--neon-shadow);
            margin: 15px 0;
        }

        .game-container {
            width: 85%; 
            height: 82vh;
            border: 5px solid var(--neon-color);
            box-shadow: var(--neon-shadow), inset 0 0 30px var(--neon-color);
            border-radius: 20px;
            background: #000;
            position: relative;
            z-index: 5;
        }

        iframe#game-screen {
            width: 100%;
            height: 100%;
            border: none;
        }

        .neon-diamond-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            cursor: pointer;
            z-index: 1000;
            background: none;
            border: none;
        }

        .diamond-svg {
            width: 50px;
            height: 50px;
            filter: drop-shadow(0 0 10px var(--neon-color));
            stroke: var(--neon-color);
            stroke-width: 1.5;
            fill: none;
        }

        footer {
            position: fixed;
            bottom: 5px;
            font-size: 10px;
            color: #444;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <h1>Paradox Gx</h1>

    <div class="game-container">
        <iframe id="game-screen" src="https://bloxd.dev" allow="autoplay; fullscreen; keyboard"></iframe>
    </div>

    <button class="neon-diamond-btn" onclick="toggleTheme()">
        <svg class="diamond-svg" viewBox="0 0 24 24">
            <path d="M12,2 22,10 12,22 2,10 12,2"/>
            <line x1="12" y1="2" x2="12" y2="22"/>
            <line x1="2" y1="10" x2="22" y2="10"/>
        </svg>
    </button>

    <footer>PRODUCED BY PARADOX STUDIO</footer>

    <script>
        let shouldWrite = true; // التحكم في دور الكتابة

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                if (shouldWrite) {
                    // المرة الأولى: نسخ الرتبة تلقائياً لتكون جاهزة للصق
                    const rankText = "{💎Gx } : ";
                    navigator.clipboard.writeText(rankText);
                    
                    // تغيير الحالة للمرة القادمة
                    shouldWrite = false;
                } else {
                    // المرة الثانية: لا يفعل شيء سوى تجهيز الدور القادم
                    shouldWrite = true;
                }
            }
        });

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }
    </script>
</body>
</html>
