<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paradox Gx | Ultra Neon</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --main-bg: #000000;
            --neon-color: #00d9ff;
            --neon-intensity: 40px;
            --neon-shadow: 0 0 10px var(--neon-color), 0 0 20px var(--neon-color), 0 0 var(--neon-intensity) var(--neon-color);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', sans-serif; }
        body { background-color: var(--main-bg); color: #fff; overflow: hidden; display: flex; flex-direction: column; align-items: center; height: 100vh; }
        #web-canvas { position: fixed; top: 0; left: 0; z-index: -1; pointer-events: none; }

        /* الأزرار العلوية */
        .top-controls { position: fixed; top: 15px; right: 15px; display: flex; gap: 12px; z-index: 1001; }
        .icon-btn {
            width: 48px; height: 48px; background: rgba(0,0,0,0.8);
            border: 2px solid var(--neon-color); border-radius: 10px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: var(--neon-shadow); transition: 0.3s; color: var(--neon-color);
        }
        .icon-btn svg { width: 24px; height: 24px; fill: currentColor; }
        .icon-btn:hover { transform: scale(1.1); box-shadow: 0 0 50px var(--neon-color); }

        /* اللوحة الجانبية */
        .panel {
            position: fixed; top: 0; right: -350px; width: 320px; height: 100%;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(20px);
            border-left: 4px solid var(--neon-color); padding: 30px 20px; z-index: 1000;
            transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: -10px 0 40px rgba(0,0,0,0.9);
        }
        .panel.active { right: 0; }
        .panel h2 { color: var(--neon-color); font-size: 14px; margin-top: 30px; border-bottom: 1px solid var(--neon-color); padding-bottom: 5px; text-transform: uppercase; }

        /* حاوية اللعبة */
        .game-container {
            width: 95%; height: 100%; margin-top: 15px;
            border: 4px solid var(--neon-color); border-radius: 25px;
            box-shadow: var(--neon-shadow); background: #000;
            transition: 0.4s ease; position: relative; z-index: 10;
        }
        .game-container.fullscreen { width: 100vw; height: 100vh; margin-top: 0; border-radius: 0; position: fixed; top: 0; left: 0; z-index: 500; }
        iframe { width: 100%; height: 100%; border: none; border-radius: 21px; }
        .fullscreen iframe { border-radius: 0; }

        h1 { margin-top: 15px; font-size: 2.5rem; color: var(--neon-color); text-shadow: var(--neon-shadow); letter-spacing: 15px; }

        /* أدوات اللوحة */
        .neon-slider { width: 100%; margin: 20px 0; accent-color: var(--neon-color); cursor: pointer; }
        .grid-colors { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px; }
        .color-dot { width: 100%; aspect-ratio: 1; border-radius: 6px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); transition: 0.2s; }
        .color-dot:hover { transform: scale(1.1); box-shadow: 0 0 15px var(--neon-color); }
    </style>
</head>
<body>

    <canvas id="web-canvas"></canvas>

    <div class="top-controls">
        <!-- زر التكبير -->
        <button class="icon-btn" onclick="toggleFullscreen()" title="Fullscreen">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
        <!-- زر الإعدادات -->
        <button class="icon-btn" id="gearBtn" onclick="toggleSettings(event)" title="Settings">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.03-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
    </div>

    <div class="panel" id="sidePanel">
        <h2>Neon Overdrive</h2>
        <input type="range" class="neon-slider" min="5" max="180" value="40" id="neonRange">
        <h2>Empire Themes</h2>
        <div class="grid-colors" id="colorGrid"></div>
        <p style="margin-top: 50px; font-size: 10px; color: #555; text-align: center;">Click outside to close</p>
    </div>

    <h1>PARADOX GX</h1>

    <div class="game-container" id="gameBox">
        <iframe src="https://bloxd.dev"></iframe>
    </div>

    <script>
        const sidePanel = document.getElementById('sidePanel');
        
        // تبديل الإعدادات
        function toggleSettings(event) {
            event.stopPropagation();
            sidePanel.classList.toggle('active');
        }

        // إغلاق اللوحة عند الضغط في أي مكان خارجها
        document.addEventListener('click', (event) => {
            if (!sidePanel.contains(event.target)) {
                sidePanel.classList.remove('active');
            }
        });

        function toggleFullscreen() {
            document.getElementById('gameBox').classList.toggle('fullscreen');
        }

        const neonRange = document.getElementById('neonRange');
        neonRange.oninput = (e) => {
            document.documentElement.style.setProperty('--neon-intensity', e.target.value + "px");
        };

        const colors = ['#00d9ff', '#39ff14', '#ff0055', '#bc13fe', '#ffff00', '#ff8800', '#ffffff', '#ff00ff', '#00ffaa', '#1e90ff'];
        const grid = document.getElementById('colorGrid');
        colors.forEach(c => {
            const d = document.createElement('div');
            d.className = 'color-dot'; d.style.background = c;
            d.onclick = () => document.documentElement.style.setProperty('--neon-color', c);
            grid.appendChild(d);
        });

        // Background Web Logic
        const canvas = document.getElementById('web-canvas');
        const ctx = canvas.getContext('2d');
        let dots = [];
        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            dots = [];
            for(let i=0; i<60; i++) dots.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5), vy: (Math.random()-0.5) });
        }
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--neon-color');
            dots.forEach(d => {
                d.x += d.vx; d.y += d.vy;
                if(d.x<0 || d.x>canvas.width) d.vx*=-1; if(d.y<0 || d.y>canvas.height) d.vy*=-1;
                ctx.beginPath(); ctx.arc(d.x, d.y, 1.5, 0, Math.PI*2); ctx.fill();
                dots.forEach(d2 => {
                    let dist = Math.hypot(d.x-d2.x, d.y-d2.y);
                    if(dist < 120) {
                        ctx.globalAlpha = 1 - (dist/120); ctx.lineWidth = 0.6;
                        ctx.beginPath(); ctx.moveTo(d.x,d.y); ctx.lineTo(d2.x,d2.y); ctx.stroke();
                        ctx.globalAlpha = 1;
                    }
                });
            });
            requestAnimationFrame(draw);
        }
        init(); draw(); window.onresize = init;
    </script>
</body>
</html>
