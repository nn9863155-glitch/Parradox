<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paradox Gx | Ultra Neon</title>
    
    <!-- تم توحيد الاسم إلى logo.png -->
    <link rel="icon" type="image/png" href="logo.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --main-bg: #000000;
            --neon-color: #00d9ff;
            --neon-intensity: 40px;
            --neon-shadow: 
                0 0 10px var(--neon-color),
                0 0 20px var(--neon-color),
                0 0 40px var(--neon-color),
                0 0 var(--neon-intensity) var(--neon-color);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', sans-serif; }

        body {
            background-color: var(--main-bg);
            color: #fff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        #web-canvas { position: fixed; top: 0; left: 0; z-index: -1; pointer-events: none; }

        .top-controls {
            position: fixed; top: 15px; right: 15px;
            display: flex; gap: 10px; z-index: 1000;
        }

        .icon-btn {
            width: 45px; height: 45px; background: rgba(0,0,0,0.8);
            border: 2px solid var(--neon-color); border-radius: 8px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: var(--neon-shadow); transition: 0.3s;
        }

        .panel {
            position: fixed; top: 0; right: -350px; width: 320px; height: 100%;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(25px);
            border-left: 4px solid var(--neon-color); padding: 30px 20px; z-index: 999;
            transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .panel.active { right: 0; }

        .neon-slider { width: 100%; height: 8px; background: #111; border-radius: 10px; margin: 20px 0; outline: none; appearance: none; }
        .neon-slider::-webkit-slider-thumb { appearance: none; width: 15px; height: 15px; background: var(--neon-color); border-radius: 50%; cursor: pointer; }

        .game-container {
            width: 95%; height:  95%; margin-top: 25px;
            border: 4px solid var(--neon-color); border-radius: 25px;
            box-shadow: var(--neon-shadow); background: #000;
            transition: 0.4s ease; position: relative; z-index: 10;
        }
        
        .game-container.fullscreen {
            width: 100vw; height: 100vh; margin-top: 0; border-radius: 0;
            position: fixed; top: 0; left: 0; z-index: 500;
        }

        iframe { width: 100%; height: 100%; border: none; border-radius: 21px; }
        .fullscreen iframe { border-radius: 0; }

        h1 { 
            margin-top: 15px; font-size: 2.8rem; color: var(--neon-color); 
            text-shadow: var(--neon-shadow); letter-spacing: 20px; font-weight: 900;
        }

        .grid-colors { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px; }
        .color-dot { width: 100%; aspect-ratio: 1; border-radius: 6px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <canvas id="web-canvas"></canvas>

    <div class="top-controls">
        <button class="icon-btn" onclick="toggleFullscreen()"><svg id="fsIcon" viewBox="0 0 24 24" width="22" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
        <button class="icon-btn" onclick="toggleSettings()"><svg viewBox="0 0 24 24" width="22" fill="currentColor"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.81,11.69,4.81,12c0,0.31,0.02,0.65,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c-0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg></button>
    </div>

    <div class="panel" id="sidePanel">
        <h2>Neon Intensity</h2>
        <input type="range" class="neon-slider" min="5" max="180" value="40" id="neonRange">
        <h2>Theme Colors</h2>
        <div class="grid-colors" id="colorGrid"></div>
        <button onclick="toggleSettings()" style="width:100%; margin-top:40px; padding:12px; background:var(--neon-color); color:#000; border:none; font-weight:bold; cursor:pointer;">CLOSE</button>
    </div>

    <h1>PARADOX GX</h1>

    <div class="game-container" id="gameBox">
        <iframe src="https://bloxd.dev"></iframe>
    </div>

    <script>
        function toggleFullscreen() { document.getElementById('gameBox').classList.toggle('fullscreen'); }
        function toggleSettings() { document.getElementById('sidePanel').classList.toggle('active'); }

        const neonRange = document.getElementById('neonRange');
        neonRange.oninput = (e) => {
            document.documentElement.style.setProperty('--neon-intensity', e.target.value + "px");
        };

        const colors = ['#00d9ff', '#39ff14', '#ff0055', '#bc13fe', '#ffff00', '#ff8800', '#ffffff', '#ff00ff', '#00ffaa', '#1e90ff'];
        const grid = document.getElementById('colorGrid');
        colors.forEach(c => {
            const d = document.createElement('div');
            d.className = 'color-dot'; d.style.background = c; d.onclick = () => document.documentElement.style.setProperty('--neon-color', c);
            grid.appendChild(d);
        });

        // Background Web Logic
        const canvas = document.getElementById('web-canvas');
        const ctx = canvas.getContext('2d');
        let dots = [];
        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            dots = [];
            for(let i=0; i<60; i++) dots.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5), vy: (Math.random()-0.5) });
        }
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--neon-color');
            dots.forEach(d => {
                d.x += d.vx; d.y += d.vy;
                if(d.x<0 || d.x>canvas.width) d.vx*=-1; if(d.y<0 || d.y>canvas.height) d.vy*=-1;
                ctx.beginPath(); ctx.arc(d.x, d.y, 1.5, 0, Math.PI*2); ctx.fill();
                dots.forEach(d2 => {
                    let dist = Math.hypot(d.x-d2.x, d.y-d2.y);
                    if(dist < 120) {
                        ctx.globalAlpha = 1 - (dist/120); ctx.lineWidth = 0.6;
                        ctx.beginPath(); ctx.moveTo(d.x,d.y); ctx.lineTo(d2.x,d2.y); ctx.stroke();
                        ctx.globalAlpha = 1;
                    }
                });
            });
            requestAnimationFrame(draw);
        }
        init(); draw(); window.onresize = init;
    </script>
</body>
</html>
